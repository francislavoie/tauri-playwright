name: Publish npm package

# The first release must be published by the npm account owner. After that,
# configure npm trusted publishing for this workflow (see PUBLISHING.md).
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @francislavoie/tauri-playwright typecheck
      - run: pnpm --filter @francislavoie/tauri-playwright test
      - run: pnpm --filter @francislavoie/tauri-playwright build
      - name: Ensure this version is unpublished
        shell: bash
        run: |
          version=$(node -p "require('./packages/test/package.json').version")
          if npm view "@francislavoie/tauri-playwright@$version" version >/dev/null 2>&1; then
            echo "::error::Version $version is already published"
            exit 1
          fi
      - name: Publish with npm trusted publishing
        working-directory: packages/test
        run: npm publish --access public --provenance
